name: CI

on:
  push:
  pull_request:
    branches:
      - master

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Gate jobs only call `nix build .#checks.<sys>.<name>`, so no `nix develop`
# default shell is needed. The check logic lives in flake.nix.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0

      - name: build
        run: nix build -L .#checks.x86_64-linux.build

  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0

      - name: formatting
        run: nix build -L .#checks.x86_64-linux.formatting

  # ── Render + deploy lane (not a flake check: the electron PDF render needs a
  #    headless X display, and Pages deploy needs the GITHUB_TOKEN). Kept on the
  #    nix develop shell. ──
  render-deploy:
    runs-on: ubuntu-latest
    needs: [build, formatting]
    # Best-effort: the electron PDF render pulls node-sass (deprecated, fails to
    # build natively on current Node). Tracked separately; don't fail CI on it.
    continue-on-error: true
    permissions:
      # peaceiris/actions-gh-pages pushes to the gh-pages branch.
      contents: write
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0

      - name: Setup Nix cache (hestia)
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0

      - name: Install dependencies
        run: make install

      - name: Run build
        run: make build

      - name: Run render
        run: xvfb-run yarn electron-pdf $GITHUB_WORKSPACE/dist/index.html $GITHUB_WORKSPACE/dist/resume.pdf

      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: resume.kradalby.no
